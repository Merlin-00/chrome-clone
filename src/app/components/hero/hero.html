<section class="hero" #container>
  <div class="hero__wrapper">
    <div class="hero__logo">
      <img src="assets/chrome.png" alt="Chrome logo" width="63" height="63" class="logo-img" />
    </div>

    <h1 class="hero__headline" #headline>
      Le navigateur <br />
      à votre image
    </h1>

    <div class="hero__cta">
      <button type="button" class="hero__download-btn">Télécharger Chrome</button>
    </div>
  </div>

  <div class="mosaic" #mosaic>
    <div class="mosaic__scaler">
      <div class="mosaic__track" #track>
        <article class="mosaic__card mosaic__card--left">
          <app-skeleton type="search-ui"></app-skeleton>
        </article>
        <article class="mosaic__card mosaic__card--extra">
          <app-skeleton type="login-ui"></app-skeleton>
        </article>
        <article class="mosaic__card mosaic__card--center">
          <app-skeleton type="search-ui"></app-skeleton>
        </article>
        <article class="mosaic__card mosaic__card--extra">
          <app-skeleton type="login-ui"></app-skeleton>
        </article>
        <article class="mosaic__card mosaic__card--right">
          <app-skeleton type="search-ui"></app-skeleton>
        </article>
      </div>
    </div>
  </div>
</section>

<!-- QR widget: show only on large screens -->
@if (isLarge()) {
<div class="footer-qr-widget" (click)="toggleQr()">
  @if (qrExpanded()) {
  <div class="footer-qr-code">
    <div class="item1">
      <img src="assets/chrome_qr_code.png" alt="QR Code Télécharger Chrome" class="qr-image" />
      <mat-icon class="arrow1">arrow_forward_ios</mat-icon>
    </div>
    <span class="qr-text">Télécharger Chrome pour votre téléphone</span>
  </div>
  } @else {
  <div class="item2">
    <mat-icon>tablet_android</mat-icon>
    <mat-icon class="arrow2">arrow_back_ios</mat-icon>
  </div>
  }
</div>
}
