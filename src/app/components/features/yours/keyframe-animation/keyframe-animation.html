<div class="keyframe-container" #container>
  <!-- Texte à gauche -->
  <div class="text-content">
    <h2 class="title">Optimisez votre expérience</h2>
    <p class="description">
      Que vous souhaitiez faire des achats, vous divertir ou être productif, vous trouverez de
      nombreuses extensions sur le Chrome Web Store pour améliorer votre expérience.
    </p>
    <a href="#" class="cta">
      Découvrir les extensions
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="icon-arrow"
      >
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>
  </div>

  <!-- Visuel à droite -->
  <div class="visual-content">
    <div class="layers-wrapper">
      <!-- Image Centrale (Statique) -->
      <img
        src="assets/sections-images/yours/image12.png"
        alt="Navigateur Chrome"
        class="main-browser-image"
        loading="lazy"
      />

      <!-- 1. Panier (Top Left) -->
      <img
        #floatingItem
        src="assets/sections-images/yours/image4.png"
        alt="Shopping"
        class="floating-item item-shop"
      />

      <!-- 2. Accessibilité (Bottom Left) -->
      <img
        #floatingItem
        src="assets/sections-images/yours/image6.png"
        alt="Accessibility"
        class="floating-item item-access"
      />

      <!-- 3. Pinceau (Bottom Center/Right) -->
      <img
        #floatingItem
        src="assets/sections-images/yours/image7.png"
        alt="Creative"
        class="floating-item item-brush"
      />

      <!-- 4. Movie (Right) -->
      <img
        #floatingItem
        src="assets/sections-images/yours/image8.png"
        alt="Entertainment"
        class="floating-item item-movie"
      />

      <!-- 5. Extension (Top Right) -->
      <img
        #floatingItem
        src="assets/sections-images/yours/image5.png"
        alt="Extension"
        class="floating-item item-ext"
      />
    </div>
  </div>
</div>
