<section id="yours" class="yours-section" #section>
  <div class="container yours-title-mobile">
    <h2 class="yours-title">
      <span class="pill-wrapper is-animated">
        <span class="pill" aria-hidden="true">
          @for (char of pillText; track $index) {
          <span class="pill-char" [style.--animation-delay.ms]="$index * 20">
            {{ char === ' ' ? '&nbsp;' : char }}
          </span>
          }
        </span>
      </span>
      <br />
      et emportez-le partout
    </h2>
  </div>
  <div class="take-over-wrapper">
    <div class="take-over-container" #stickyContainer>
      <div class="take-over-sticky-content">
        <div class="container title-container">
          <h2 class="yours-title">
            <span class="pill-wrapper" #pill>
              <span class="pill" aria-hidden="true">
                @for (char of pillText; track $index) {
                <span class="pill-char" [style.--animation-delay.ms]="$index * 20">
                  {{ char === ' ' ? '&nbsp;' : char }}
                </span>
                }
              </span>
            </span>
            et
            <br />
            emportez-le partout
          </h2>
        </div>
        <!-- ZONE IMAGES -->
        <div class="animation-wrapper" #animationWrapper>
          <div class="animation-mask">
            <!-- LAYER 1 (Bottom): Image 10 (Révélée quand la 9 part) -->
            <div class="take-over-layer layer-bottom">
              <img
                src="assets/sections-images/yours/image10.webp"
                alt="Interface standard"
                loading="eager"
              />
            </div>

            <!-- LAYER 2 (Middle): Image 9 (Cover initial, elle se clip vers le bas) -->
            <div class="take-over-layer layer-middle-cover">
              <img
                src="assets/sections-images/yours/image9.webp"
                alt="Interface accueil"
                loading="eager"
              />
            </div>

            <!-- LAYER 3 (Top): Image 11 (Dark mode, arrive à la fin) -->
            <div class="take-over-layer layer-top-reveal">
              <img
                src="assets/sections-images/yours/image11.webp"
                alt="Interface dark mode"
                loading="lazy"
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="timed-accordion-block">
    <app-timed-accordion></app-timed-accordion>
  </div>
  <div class="keyframe-animation-block take-over-wrapper">
    <app-keyframe-animation></app-keyframe-animation>
  </div>
</section>
