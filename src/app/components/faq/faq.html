<section class="faq-section">
  <div class="container">
    <h2 class="faq-title">Questions fréquentes</h2>

    <div class="accordion-wrapper">
      @for (item of faqItems(); track $index) {
      <div class="accordion-item" [class.is-open]="openIndex() === $index">
        <button class="item-header" (click)="toggleItem($index)">
          <span class="item-question">{{ item.question }}</span>
          <mat-icon class="item-icon">{{ openIndex() === $index ? 'close' : 'add' }}</mat-icon>
        </button>
        <div class="item-content">
          <div class="content-inner">
            <p [innerHTML]="item.answer"></p>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
</section>
