<!-- ====================================================================== -->
<!-- 🧩 LAYOUT PRINCIPAL DE L'APPLICATION                                  -->
<!-- ====================================================================== -->

<!-- The header remains visible by default; we only hide it when `hideHeader` is true -->
@if (!hideHeader()) {
<app-header></app-header>
}

<!-- The short-bar appears when `showShortBar` is true. Both header and short-bar may be visible at the same time. -->
@if (showShortBar()) {
<app-short-bar></app-short-bar>
}

<!-- Conteneur principal qui gère le scroll -->
<div class="main-scroll-container">
  <main class="main-content">
    <app-hero></app-hero>
    <app-features></app-features>
  </main>
  <app-faq></app-faq>
  <app-closing-banner></app-closing-banner>
  <app-footer></app-footer>
</div>

<!-- Sidenav Mobile (affiché uniquement en petit écran) -->
<app-sidenav></app-sidenav>
